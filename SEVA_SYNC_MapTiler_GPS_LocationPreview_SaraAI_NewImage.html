<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEVA SYNC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js">


</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0F1517;
  --bg-raise:#141C1F;
  --surface:#182124;
  --surface-glass: rgba(255,255,255,0.045);
  --surface-glass-hi: rgba(255,255,255,0.075);
  --border: rgba(255,255,255,0.09);
  --border-soft: rgba(255,255,255,0.055);
  --text:#EDEFEC;
  --text-dim:#A7B3AE;
  --text-faint:#6E7C77;
  --green:#3E7C59;
  --green-hi:#5FA179;
  --green-deep:#274A38;
  --ochre:#C98A3B;
  --ochre-hi:#E0A65B;
  --clay:#C1553B;
  --clay-hi:#DD6E52;
  --blue:#3E7690;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(62,124,89,0.16), transparent 60%),
    radial-gradient(900px 600px at -5% 10%, rgba(201,138,59,0.10), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--green-deep); color:var(--text);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}
:focus-visible{outline:2px solid var(--ochre-hi); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

/* ============ APP SHELL ============ */
.app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:252px; flex-shrink:0;
  background:linear-gradient(180deg, var(--bg-raise), var(--bg));
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  z-index:40;
}
.sidebar-brand{
  display:flex; align-items:center; gap:12px;
  padding:22px 20px 18px 22px;
  border-bottom:1px solid var(--border-soft);
}
.brand-mark{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(145deg, var(--green), var(--green-deep));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(62,124,89,0.35);
  flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text strong{font-family:var(--font-display); font-size:14.5px; font-weight:600;}
.brand-text span{font-size:11px; color:var(--text-faint); letter-spacing:0.02em;}
.sidebar-nav{flex:1; overflow-y:auto; padding:14px 12px;}
.nav-group-label{font-size:10.5px; color:var(--text-faint); padding:14px 10px 6px; letter-spacing:0.04em;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9.5px 11px; border-radius:10px;
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  cursor:pointer; margin-bottom:2px;
  border:1px solid transparent;
  transition:background 0.15s ease, color 0.15s ease;
  position:relative;
}
.nav-item svg{width:17px;height:17px; flex-shrink:0; opacity:0.85;}
.nav-item:hover{background:var(--surface-glass); color:var(--text);}
.nav-item.active{
  background:linear-gradient(90deg, rgba(62,124,89,0.22), rgba(62,124,89,0.05));
  color:var(--text); border-color:rgba(95,161,121,0.28);
}
.nav-item.active svg{opacity:1;}
.nav-item .badge{
  margin-left:auto; font-size:10px; background:var(--clay); color:#fff;
  padding:1px 6px; border-radius:20px; font-weight:600;
}
.sidebar-foot{
  padding:14px 18px 18px; border-top:1px solid var(--border-soft);
  font-size:11px; color:var(--text-faint); line-height:1.5;
}

/* ---- Main ---- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:14px 28px; background:rgba(15,21,23,0.82);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.search-wrap{
  flex:1; max-width:520px; position:relative;
}
.search-wrap input{
  width:100%; background:var(--surface-glass); border:1px solid var(--border);
  border-radius:11px; padding:10px 14px 10px 38px; color:var(--text);
  font-size:13.5px; font-family:var(--font-body);
}
.search-wrap input::placeholder{color:var(--text-faint);}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px;height:16px; color:var(--text-faint);}
.topbar-spacer{flex:1;}
.topbar-brand-center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  gap:4px;
  font-family:var(--font-display);
  font-size:19px;
  font-weight:800;
  letter-spacing:-.045em;
  line-height:1;
  white-space:nowrap;
  pointer-events:none;
  color:#17324D;
}
.topbar-brand-center span{
  background:linear-gradient(100deg,#10A9DF 0%,#18A9D7 48%,#79BE32 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.topbar-brand-center::after{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:#79BE32;
  margin-left:2px;
  box-shadow:0 0 0 3px rgba(121,190,50,.12);
}
@media(max-width:720px){
  .topbar-brand-center{font-size:16px;}
}
@media(max-width:560px){
  .topbar-brand-center{display:none;}
}
.icon-btn{
  width:38px;height:38px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-glass); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--text-dim); position:relative; flex-shrink:0;
  transition:background 0.15s ease, color 0.15s ease;
}
.icon-btn:hover{background:var(--surface-glass-hi); color:var(--text);}
.icon-btn svg{width:17px;height:17px;}
.icon-btn .dot{
  position:absolute; top:7px; right:7px; width:7px;height:7px; border-radius:50%;
  background:var(--clay-hi); border:1.5px solid var(--bg-raise);
}
.user-chip{
  display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px;
  border-radius:30px; border:1px solid var(--border); background:var(--surface-glass);
  cursor:pointer;
}
.user-avatar{
  width:26px;height:26px;border-radius:50%; background:linear-gradient(140deg, var(--ochre), var(--clay));
  display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; color:#1a1310;
}
.user-chip span{font-size:12.5px; color:var(--text-dim); font-weight:500;}


.profile-photo-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.profile-avatar-large{width:76px;height:76px;border-radius:50%;background:linear-gradient(140deg,var(--ochre),var(--clay));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px;font-weight:700;color:#1a1310;overflow:hidden;border:2px solid rgba(255,255,255,.12);flex-shrink:0;}
.profile-avatar-large img{width:100%;height:100%;object-fit:cover;}
.profile-photo-actions{display:flex;flex-direction:column;gap:7px;}
.profile-photo-actions label{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-glass);font-size:12px;color:var(--text-dim);cursor:pointer;}
.profile-photo-actions label:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
.profile-save-bar{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);}

.content{flex:1; padding:26px 28px 60px;}
.view{display:none;}
.view.active{display:block; animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ============ SHARED COMPONENTS ============ */
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.section-head h2{font-size:21px; font-weight:600;}
.section-head p{color:var(--text-dim); font-size:13px; margin-top:5px;}
.pill-row{display:flex; gap:8px; flex-wrap:wrap;}
.pill{
  padding:7px 13px; border-radius:30px; border:1px solid var(--border);
  background:var(--surface-glass); font-size:12.5px; color:var(--text-dim); cursor:pointer;
  transition:all 0.15s ease; user-select:none;
}
.pill:hover{border-color:rgba(95,161,121,0.4); color:var(--text);}
.pill.active{background:var(--green-deep); border-color:var(--green-hi); color:#fff;}

.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:20px;
}
.glass{
  background:var(--surface-glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--border);
}
.grid{display:grid; gap:16px;}
.grid-kpi{grid-template-columns:repeat(4, 1fr);}
.grid-2{grid-template-columns:1.4fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:1200px){ .grid-kpi{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-4{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){ .grid-kpi{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} .grid-4{grid-template-columns:1fr;} }

.kpi-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:17px 18px; position:relative; overflow:hidden; cursor:default;
  transition:transform 0.18s ease, border-color 0.18s ease;
}
.kpi-card:hover{transform:translateY(-2px); border-color:rgba(95,161,121,0.3);}
.kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.kpi-icon{width:32px;height:32px;border-radius:9px; display:flex; align-items:center; justify-content:center;}
.kpi-icon svg{width:16px;height:16px;}
.kpi-value{font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1;}
.kpi-label{font-size:12px; color:var(--text-dim); margin-top:7px;}
.kpi-trend{font-size:11px; margin-top:8px; display:flex; align-items:center; gap:4px;}
.trend-up{color:var(--green-hi);}
.trend-down{color:var(--clay-hi);}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 17px; border-radius:10px;
  font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; font-family:var(--font-body);
  transition:all 0.15s ease;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:linear-gradient(145deg, var(--green-hi), var(--green)); color:#0c1610; box-shadow:0 6px 18px rgba(62,124,89,0.28);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--surface-glass); border-color:var(--border); color:var(--text-dim);}
.btn-ghost:hover{color:var(--text); border-color:rgba(255,255,255,0.2);}
.btn-ochre{background:linear-gradient(145deg, var(--ochre-hi), var(--ochre)); color:#241705;}

.badge-status{padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; display:inline-block; white-space:nowrap;}
.badge-High{background:rgba(193,85,59,0.18); color:var(--clay-hi);}
.badge-Medium{background:rgba(201,138,59,0.18); color:var(--ochre-hi);}
.badge-Low{background:rgba(62,124,89,0.2); color:var(--green-hi);}

.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; padding:10px 14px; color:var(--text-faint); font-weight:600; font-size:11px;
  letter-spacing:0.03em; border-bottom:1px solid var(--border-soft); white-space:nowrap; cursor:pointer;
}
th:hover{color:var(--text-dim);}
td{padding:11px 14px; border-bottom:1px solid var(--border-soft); color:var(--text-dim); white-space:nowrap;}
tr:hover td{background:rgba(255,255,255,0.02); color:var(--text);}
.row-clickable{cursor:pointer;}

.tag-sector{
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:8px;
  background:var(--surface-glass); border:1px solid var(--border); font-size:12px; color:var(--text-dim);
  cursor:pointer; transition:all 0.15s ease;
}
.tag-sector:hover, .tag-sector.active{border-color:var(--green-hi); color:var(--text); background:rgba(62,124,89,0.14);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--text-faint);
}
.empty-state svg{width:38px;height:38px; margin-bottom:12px; opacity:0.5;}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(6,9,10,0.72); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-raise); border:1px solid var(--border); border-radius:var(--radius-lg);
  width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:26px;
  box-shadow:0 24px 60px rgba(0,0,0,0.5);
  animation:modalIn 0.22s ease;
}
@keyframes modalIn{from{opacity:0; transform:translateY(12px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-close{cursor:pointer; width:30px;height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
.modal-close:hover{background:var(--surface-glass); color:var(--text);}

.form-field{margin-bottom:15px;}
.form-field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
.form-field input, .form-field select, .form-field textarea{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:9px;
  padding:10px 12px; color:var(--text); font-family:var(--font-body); font-size:13.5px;
}
.form-field textarea{resize:vertical; min-height:80px;}
.form-row{display:flex; gap:12px;}
.form-row .form-field{flex:1;}

/* toast */
#toast-host{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--bg-raise); border:1px solid var(--border); border-radius:12px; padding:13px 16px;
  font-size:13px; max-width:340px; box-shadow:0 12px 30px rgba(0,0,0,0.4); display:flex; gap:10px; align-items:flex-start;
  animation:toastIn 0.25s ease;
}
@keyframes toastIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}
.toast svg{width:16px;height:16px; flex-shrink:0; margin-top:1px;}
.toast.ok svg{color:var(--green-hi);}
.toast.warn svg{color:var(--clay-hi);}

/* ============ HERO ============ */
.hero{
  position:relative; border-radius:24px; overflow:hidden; padding:38px 34px;
  background:
    radial-gradient(700px 340px at 88% 0%, rgba(62,124,89,0.35), transparent 65%),
    radial-gradient(500px 300px at 10% 110%, rgba(201,138,59,0.22), transparent 65%),
    linear-gradient(160deg, #17211F, #101716);
  border:1px solid var(--border); margin-bottom:22px;
}
.hero-topo{position:absolute; inset:0; opacity:0.5; pointer-events:none;}
.hero-inner{position:relative; z-index:2; display:flex; justify-content:space-between; align-items:flex-end; gap:30px; flex-wrap:wrap;}
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--green-hi);
  background:rgba(62,124,89,0.15); border:1px solid rgba(95,161,121,0.3); padding:6px 12px; border-radius:20px; margin-bottom:16px;
}
.hero-eyebrow .live-dot{width:6px;height:6px;border-radius:50%; background:var(--green-hi); box-shadow:0 0 0 3px rgba(95,161,121,0.25);}
.hero h1{font-size:38px; font-weight:700; max-width:640px; line-height:1.12;}
.hero .sub{font-size:15.5px; color:var(--text-dim); margin-top:12px; max-width:480px;}
.hero-actions{display:flex; gap:10px; margin-top:22px;}
.hero-side{display:flex; flex-direction:column; gap:10px; min-width:220px;}
.hero-stat{display:flex; justify-content:space-between; align-items:center; padding:11px 14px; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft); border-radius:11px;}
.hero-stat b{font-family:var(--font-display); font-size:18px;}
.hero-stat span{font-size:11.5px; color:var(--text-faint);}

/* ============ MAP / DISTRICT SEVERITY MODULE ============ */
.map-shell{position:relative;display:flex;gap:18px;align-items:stretch;}
.severity-map-wrap{flex:1.6;min-width:0;min-height:540px;position:relative;background:#fff;border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden;}
#severity-map{width:100%;height:540px;background:#f4f6f9;}
.severity-sidebar{width:320px;flex-shrink:0;background:#fff;color:#333;border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:20px;overflow-y:auto;max-height:540px;}
.severity-sidebar h3{font-size:16px;color:#2c3e50;margin-bottom:12px;}
.severity-district-list{list-style:none;margin:0;padding:0;}
.severity-district-item{padding:10px 11px;margin-bottom:7px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;transition:all .18s ease;border:1px solid #eee;background:#fff;color:#333;}
.severity-district-item:hover{background:#f0f4f8;transform:translateX(2px);}
.severity-badge{padding:4px 8px;border-radius:12px;font-size:9px;font-weight:700;color:#fff;text-transform:uppercase;white-space:nowrap;}
.severity-legend{position:absolute;z-index:500;right:14px;bottom:14px;background:rgba(255,255,255,.96);color:#333;padding:12px 14px;border-radius:9px;box-shadow:0 4px 18px rgba(0,0,0,.18);font-size:11px;line-height:20px;}
.severity-legend i{width:14px;height:14px;float:left;margin:3px 7px 0 0;opacity:.9;border-radius:3px;}
.severity-map-title{position:absolute;z-index:500;top:14px;left:14px;right:14px;pointer-events:none;}
.severity-map-title span{display:inline-block;padding:8px 12px;border-radius:9px;background:rgba(15,21,23,.86);color:#fff;font-size:12px;font-weight:600;}
.severity-map-wrap .leaflet-container{font-family:var(--font-body);}
.severity-map-wrap .leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
@media (max-width:1000px){.severity-sidebar{width:100%;max-height:none;}.severity-map-wrap{min-height:420px;}#severity-map{height:420px;}.map-shell{flex-direction:column;}}
/* pipeline */
.pipeline-track{display:flex; align-items:stretch; gap:6px; overflow-x:auto; padding-bottom:10px;}
.pipeline-stage{
  flex:1; min-width:108px; background:var(--surface); border:1px solid var(--border-soft); border-radius:12px;
  padding:14px 12px; position:relative; transition:border-color 0.15s ease;
}
.pipeline-stage:hover{border-color:rgba(95,161,121,0.35);}
.pipeline-stage .n{font-family:var(--font-display); font-size:21px; font-weight:600;}
.pipeline-stage .lbl{font-size:11.5px; color:var(--text-dim); margin-top:5px; line-height:1.3;}
.pipeline-stage .pct{font-size:10.5px; color:var(--text-faint); margin-top:8px;}
.pipeline-arrow{display:flex; align-items:center; color:var(--text-faint); flex-shrink:0;}
.pipeline-arrow svg{width:14px;height:14px;}

/* star rating */
.stars{display:flex; gap:3px;}
.star{width:16px;height:16px; cursor:pointer; color:#9AA6B2; transition:color .1s;}
.star.filled{color:var(--ochre-hi);}
.stars.interactive .star:hover ~ .star{color:#9AA6B2;}

/* utility */
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-10{gap:10px;} .gap-14{gap:14px;}
.mt-8{margin-top:8px;} .mt-14{margin-top:14px;} .mt-20{margin-top:20px;} .mb-14{margin-bottom:14px;}

.sara-msg{max-width:84%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.sara-msg.bot{align-self:flex-start;background:#fff;color:#17324D;border:1px solid rgba(23,50,77,.09);border-bottom-left-radius:5px}
.sara-msg.user{align-self:flex-end;background:#EAF7D9;color:#17324D;border-bottom-right-radius:5px}
.sara-quick{display:flex;gap:7px;flex-wrap:wrap;padding:9px 12px;background:#fff;border-top:1px solid rgba(23,50,77,.08)}
.sara-quick button{border:1px solid rgba(23,50,77,.14);background:#fff;color:#17324D;border-radius:18px;padding:6px 9px;font-size:11px;cursor:pointer}
.sara-quick button:hover{background:#EAF7D9}
.sara-input{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid rgba(23,50,77,.1)}
.sara-input input{flex:1;min-width:0;border:1px solid rgba(23,50,77,.15);border-radius:12px;padding:10px 11px;outline:none;font-size:13px}
.sara-input input:focus{border-color:#6D8FA8}
.sara-send{width:42px;border:0;border-radius:12px;background:#17324D;color:#fff;cursor:pointer;font-size:16px}
@media(max-width:600px){.sara-launcher{right:15px;bottom:15px;width:172px;max-width:calc(100vw - 30px)}.sara-panel{right:15px;bottom:83px;width:calc(100vw - 30px);height:470px}}
</style>

const USER_REPORTS_KEY = 'jharkhand_sih_user_reports_v1';
const PROFILE_KEY = 'jharkhand_sih_profile_v1';
const DEFAULT_PROFILE = { name:'District Officer', role:'Government Validation', phone:'', district:'Ranchi', bio:'', photo:'' };
function loadProfile(){ try{ return {...DEFAULT_PROFILE, ...(JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{})}; }catch(e){ return {...DEFAULT_PROFILE}; } }
function getInitials(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return 'DO';
  return parts.length===1 ? parts[0].slice(0,2).toUpperCase() : (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
let profile = loadProfile();
function saveProfile(){ localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
function updateProfileUI(){
  const chip = document.querySelector('.user-chip');
  if(!chip) return;
  const avatar = chip.querySelector('.user-avatar');
  const label = chip.querySelector('span');
  if(avatar){ avatar.innerHTML = profile.photo ? `<img src=\"${profile.photo}\" alt=\"Profile photo\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%;\">` : escapeHtml(getInitials(profile.name)); }
  if(label) label.textContent = profile.name || 'District Officer';
}

function toast(msg, kind='ok'){
  const host = el('toast-host');
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = (kind==='ok'?icon('check'):icon('alert')) + '<div>' + msg + '</div>';

  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 4200);
}

function normalizeCityName(value){
  return String(value||'').trim().toLowerCase().replace(/[.\-]+/g,' ').replace(/\s+/g,' ');
}
function getManualCityLocation(value){
  const key = normalizeCityName(value);
  const match = Object.entries(JHARKHAND_CITY_LOCATIONS).find(([city])=>normalizeCityName(city)===key);
  if(match) return {city:match[0], ...match[1]};
  const districtMatch = DISTRICT_NAMES.find(d=>normalizeCityName(d)===key);
  if(districtMatch){
    const geoKey = DATA.districts[districtMatch]?.geoKey;
    const info = DATA.map.districts[geoKey];
    if(info?.centroid){
      const b=DATA.map.bbox,s=DATA.map.scale,p=DATA.map.padding;
      const lon=(info.centroid[0]-p)/s+b.minLon;
      const lat=b.maxLat-(info.centroid[1]-p)/s;
      return {city:districtMatch,district:districtMatch,lat,lon};
    }
  }
  return null;
}

function setManualLocation(){
  const input=el('manual-location');
  const statusText=el('gps-status-text');
  const value=input?.value.trim();
  if(!value){
    statusText.innerHTML='<b style="color:var(--clay-hi)">Enter a Jharkhand city or district name.</b>';
    return;
  }
  const loc=getManualCityLocation(value);
  if(!loc){
    statusText.innerHTML='<b style="color:var(--clay-hi)">Location not recognized.</b> Try Ranchi, Jamshedpur, Dhanbad, Bokaro, Deoghar, Hazaribagh or another Jharkhand district/city.';
    return;
  }
  const geoKey=DATA.districts[loc.district]?.geoKey;
  state.gps={lat:loc.lat,lon:loc.lon,source:'manual',city:loc.city};
  el('f-district').value=loc.district;
  el('submit-challenge').disabled=false;
  el('submit-challenge').style.opacity=1;
  statusText.innerHTML=`<b style="color:var(--green-hi)">Manual location selected.</b> ${loc.city}, Jharkhand · ${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}`;
  renderReportMap({lat:loc.lat,lon:loc.lon,geoKey,districtName:loc.district});
}

function requestGPS(){
  const statusText = el('gps-status-text');
  const btn = el('gps-btn');
  if(!navigator.geolocation){
    statusText.textContent = 'Geolocation is not supported by this browser.';
    return;
  }
  btn.textContent = 'Locating…';
  statusText.textContent = 'Requesting device location…';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    handleGPSResult(lat, lon);
    btn.textContent = 'Re-check';
  }, err=>{
    statusText.innerHTML = '<b style="color:var(--ochre-hi)">GPS unavailable.</b> Enter a Jharkhand city below to set the reporting location manually.';
    btn.textContent = 'Try again';
  }, { enableHighAccuracy:true, timeout:8000 });
}

function pointInRing(lon, lat, ring){
  let inside = false;
  for(let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi>lat) !== (yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function findDistrictForPoint(lon, lat){
  for(const [geoKey, info] of Object.entries(DATA.map.districts)){
    for(const ring of info.ringsLonLat){
      if(pointInRing(lon, lat, ring)) return geoKey;
    }
  }
  return null;
}
function geoKeyToDistrictNames(geoKey){
  return DISTRICT_NAMES.filter(n=>DATA.districts[n].geoKey===geoKey);
}
function projectLonLat(lon, lat){
  const b = DATA.map.bbox, s = DATA.map.scale, p = DATA.map.padding;
  return [ (lon-b.minLon)*s + p, (b.maxLat-lat)*s + p ];
}

function handleGPSResult(lat, lon, isFallback){
  state.gps = {lat, lon};
  const statusText = el('gps-status-text');
  const geoKey = findDistrictForPoint(lon, lat);
  if(!geoKey){
    state.gps = null;
    statusText.innerHTML = `<b style="color:var(--clay-hi)">Location outside Jharkhand.</b> Complaints can only be submitted from within Jharkhand.`;
    el('f-district').value = '';
    el('submit-challenge').disabled = true;
    el('submit-challenge').style.opacity = 0.5;
    renderReportMap(null);
    return;
  }
  const names = geoKeyToDistrictNames(geoKey);
  const districtName = names[0];
  el('f-district').value = districtName;
  el('submit-challenge').disabled = false;
  el('submit-challenge').style.opacity = 1;
  statusText.innerHTML = `Detected inside <b style="color:var(--green-hi)">${districtName}</b> district · ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  renderReportMap({lat,lon,geoKey,districtName});
}

let reportLeafletMap = null;

function renderReportMap(loc){
  const holder = el('report-map-holder');
  if(reportLeafletMap){ reportLeafletMap.remove(); reportLeafletMap = null; }
  if(!loc){
    holder.innerHTML = `<div class="empty-state">${icon('alert')}<div class="small">Point falls outside Jharkhand boundary — submission blocked.</div></div>`;
    return;
  }

  holder.innerHTML = `<div id="report-map-leaflet" style="width:100%;height:300px;"></div>`;

  reportLeafletMap = L.map('report-map-leaflet', {
    zoomControl: true,
    attributionControl: true
  }).setView([loc.lat, loc.lon], 14);

  // MapTiler basemap for the citizen's GPS/manual reporting location.
  // This uses the same MapTiler API key and Leaflet setup as the main map.
  L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${MAPTILER_API_KEY}`, {
    tileSize: 512,
    zoomOffset: -1,
    minZoom: 1,
    maxZoom: 20,
    attribution: '&copy; MapTiler &copy; OpenStreetMap contributors'
  }).addTo(reportLeafletMap);

  const marker = L.circleMarker([loc.lat, loc.lon], {
    radius: 9,
    fillColor: '#E0A65B',
    color: '#ffffff',
    weight: 3,
    opacity: 1,
    fillOpacity: 0.95
  }).addTo(reportLeafletMap);

  marker.bindPopup(`
    <div style="font-size:13px;color:#333;min-width:180px;">
      <b>Reporting Location</b><br>
      ${escapeHtml(loc.districtName || 'Jharkhand')}<br>
      <span style="color:#666;">${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}</span>
    </div>
  `).openPopup();

  setTimeout(()=>reportLeafletMap && reportLeafletMap.invalidateSize(), 80);
}

function submitChallenge(){
  if(!state.gps){ toast('Please enable GPS location before submitting.', 'warn'); return; }
  const title=el('f-title').value.trim(), desc=el('f-desc').value.trim();
  if(!title){toast('Please add a short problem title.','warn');return;}
  const now=new Date(), district=el('f-district').value;
  const report={
    id:`SIH-USER-${Date.now().toString().slice(-7)}`, title:escapeHtml(title), description:escapeHtml(desc||'No description provided.'),
    district, sector:el('f-sector').value, priority:el('f-priority').value, status:'Reported',
    ruralUrban:el('f-ruralurban').value, block:state.gps.source==='manual'?'Manual city selection':'GPS identified', village:state.gps.city||'GPS location', citizen:'You',
    dateReported:now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),
    submittedAt:now.toISOString(), lat:state.gps.lat, lng:state.gps.lon, source:'citizen-report'
  };
  DATA.challenges.unshift(report);
  saveUserReport(report);

  el('manual-location').value='';
  el('f-title').value=''; el('f-desc').value=''; el('upload-filename').textContent='';

}

  const kw = {
    'Water Management': ['water','hand pump','irrigation','canal','drinking'],
    'Healthcare': ['health','medicine','hospital','anm','doctor','phc'],
    'Education': ['school','teacher','classroom','student'],
    'Roads & Infrastructure': ['road','bridge','street','pothole'],
    'Energy': ['electricity','power','transformer','streetlight'],
    'Sanitation': ['toilet','drain','garbage','waste'],
    'Agriculture': ['crop','farmer','paddy','soil'],
  };
  let best='Public Services', bestScore=0;
  for(const [cat, words] of Object.entries(kw)){
    const score = words.filter(w=>t.includes(w)).length;
    if(score>bestScore){ bestScore=score; best=cat; }
  }
  const district = DISTRICT_NAMES.find(d=>t.includes(d.toLowerCase())) || DISTRICT_NAMES[Math.floor(Math.random()*DISTRICT_NAMES.length)];
  const priority = /shortage|no |never|months|urgent|severe|contaminat/.test(t) ? 'High' : (t.length>80?'Medium':'Medium');
  const uni = DATA.universities[Math.floor(Math.random()*DATA.universities.length)];
  return {
    category: best, district, priority,
    duplicateProbability: Math.floor(Math.random()*30)+5,
    recommendedExpertise: best==='Water Management' ? 'Civil Engineering + Environmental Science' : best==='Healthcare' ? 'Public Health + Biomedical Engineering' : best==='Education'?'Education Technology':'Relevant Engineering / Social Sciences',
    recommendedInstitution: uni.short,
    source: 'local'
  };
}
async function callClaudeClassifier(text){
  const sys = `You are the AI intelligence layer of a Jharkhand (India) civic-problem platform. Classify the citizen-reported problem below.
Respond with ONLY strict JSON, no prose, no markdown fences, matching exactly this shape:
{"category":"<one of Water Management, Healthcare, Education, Agriculture, Sanitation, Environment, Roads & Infrastructure, Energy, Rural Livelihood, Tribal Development, Women & Child Welfare, Accessibility, Public Services>","district":"<a real Jharkhand district name, or 'Unspecified' if none is implied>","priority":"<High, Medium, or Low>","duplicateProbability":<integer 0-100>,"recommendedExpertise":"<short phrase of academic/technical expertise needed>","recommendedInstitution":"<pick one from: ${DATA.universities.map(u=>u.short).join(', ')}>"}`;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, system: sys,
      messages:[{ role:"user", content: text }] })
  });
  const data = await resp.json();
  const textBlock = (data.content||[]).find(c=>c.type==='text');
  if(!textBlock) throw new Error('no text');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  parsed.source = 'ai';
  return parsed;
}

function renderFeedbackFeed(query=''){
  const feed = el('feedback-feed');
  if(!feed) return;
  const q = String(query).trim().toLowerCase();
  const feedback = getAllFeedback().map((f, index)=>({...f, _index:index})).reverse().filter(f=>{
    const haystack = [f.name, f.district, f.solution, f.text, f.comment, f.date].join(' ').toLowerCase();
    return !q || haystack.includes(q);
  });

  feed.innerHTML = feedback.length ? feedback.map(f=>`
    <div class="card" style="padding:15px; background:var(--surface-glass); border-color:${f.source==='citizen'?'rgba(95,161,121,0.3)':'var(--border-soft)'};">
      <div class="flex justify-between items-center mb-8" style="gap:8px;">
        <div><b style="font-size:12.5px;">${escapeFeedbackText(f.name || 'Citizen')}</b><div class="text-faint" style="font-size:10.5px; margin-top:3px;">${escapeFeedbackText(f.district || 'Jharkhand')}</div></div>
        <div class="stars">${starHtml(Number(f.rating)||0)}</div>
      </div>
      ${f.solution ? `<div style="font-size:11px; color:var(--green-hi); margin-bottom:7px;">${escapeFeedbackText(f.solution)}</div>` : ''}
      <p class="small text-dim" style="line-height:1.55;">${escapeFeedbackText(f.text || f.comment || '')}</p>
      <div class="text-faint" style="font-size:10px; margin-top:10px;">${escapeFeedbackText(f.date || 'Platform feedback')}${f.source==='citizen' ? ' · New citizen submission' : ''}</div>
    </div>`).join('') : `<div class="empty-state" style="grid-column:1/-1; padding:35px 20px;">${icon('search')}<p>No feedback matches your search.</p></div>`;
}

function filterFeedbackFeed(query){ renderFeedbackFeed(query); }

function starHtml(count){
  const n = Math.max(0, Math.min(5, Number(count)||0));
  return [1,2,3,4,5].map(i=>`<span class="star ${i<=n?'filled':''}">${icon('star')}</span>`).join('');
}

let currentRating = 0;
function setRating(n){
  currentRating = Math.max(1, Math.min(5, Number(n)||0));
  document.querySelectorAll('#rate-stars .star').forEach(s=>s.classList.toggle('filled', +s.dataset.v<=currentRating));
}

function submitRating(){
  const name = el('feedback-name')?.value.trim();
  const district = el('feedback-district')?.value;
  const solution = el('feedback-solution')?.value.trim();
  const comment = el('rate-comment')?.value.trim();

  if(!name){ toast('Please enter your name.', 'warn'); el('feedback-name')?.focus(); return; }
  if(!district){ toast('Please select your district.', 'warn'); el('feedback-district')?.focus(); return; }
  if(!solution){ toast('Please enter the solution or project name.', 'warn'); el('feedback-solution')?.focus(); return; }
  if(!currentRating){ toast('Please select a star rating.', 'warn'); return; }
  if(!comment){ toast('Please add a short comment so your feedback can be useful.', 'warn'); el('rate-comment')?.focus(); return; }

  const newFeedback = {
    id: 'FB-' + Date.now().toString(36).toUpperCase(),
    name, district, solution, rating: currentRating, text: comment,
    date: feedbackDate(), source:'citizen'
  };
  const stored = getStoredFeedback();
  stored.push(newFeedback);
  try{
    localStorage.setItem('jharkhandCitizenFeedback', JSON.stringify(stored));
  }catch(e){
    toast('Feedback could not be saved in this browser.', 'warn');
    return;
  }

  currentRating = 0;
  toast('Feedback submitted successfully — it is now visible in the Citizen Feedback feed.', 'ok');
  renderFeedback();
}

function renderSettings(){
  const p = profile;
  el('view-settings').innerHTML = `
    <div class="section-head">
      <div><h2>Settings</h2><p>Manage your profile details and platform preferences.</p></div>
    </div>
    <div class="grid grid-2">
      <div class="card">

          <div class="profile-avatar-large" id="settings-avatar">${p.photo ? `<img src="${p.photo}" alt="Profile photo">` : escapeHtml(getInitials(p.name))}</div>
          <div class="profile-photo-actions">
            <label for="profile-photo-input">Change profile photo</label>
            <input id="profile-photo-input" type="file" accept="image/*" style="display:none;">
            <button type="button" class="btn btn-ghost" style="font-size:11px;padding:7px 11px;" onclick="removeProfilePhoto()">Remove photo</button>

          </div>
        </div>
        <div class="form-field"><label>Full name</label><input id="profile-name" value="${escapeHtml(p.name)}" placeholder="Enter your full name"></div>
        <div class="form-row">
          <div class="form-field"><label>Role / Designation</label><input id="profile-role" value="${escapeHtml(p.role)}" placeholder="Enter role"></div>
          <div class="form-field"><label>Assigned district</label><select id="profile-district">${DISTRICT_NAMES.map(d=>`<option ${d===p.district?'selected':''}>${escapeHtml(d)}</option>`).join('')}</select></div>
        </div>
        <div class="form-row">
          <div class="form-field"><label>Phone</label><input id="profile-phone" type="tel" value="${escapeHtml(p.phone)}" placeholder="10-digit mobile number"></div>
        </div>
        <div class="form-field"><label>Profile / About</label><textarea id="profile-bio" placeholder="Short profile description...">${escapeHtml(p.bio)}</textarea></div>
        <div class="profile-save-bar">
          <button type="button" class="btn btn-ghost" onclick="resetProfileForm()">Reset</button>
          <button type="button" class="btn btn-primary" onclick="saveProfileChanges()">${icon('check')} Save Changes</button>
        </div>
      </div>
      <div class="card">
        <h3 style="font-size:14px; margin-bottom:14px;">Platform preferences</h3>
        <div class="flex justify-between items-center" style="padding:10px 0; border-bottom:1px solid var(--border-soft);"><span class="small">Restrict submissions to Jharkhand GPS</span><span class="pill active" style="cursor:default;">On</span></div>
        <div class="flex justify-between items-center" style="padding:10px 0;"><span class="small">AI auto-classification</span><span class="pill active" style="cursor:default;">On</span></div>
        <div class="card" style="margin-top:16px;padding:14px;background:var(--surface-glass);">
          <b style="font-size:13px;">Profile preview</b>
          <div class="flex items-center gap-10" style="margin-top:12px;">
            <div class="user-avatar" id="settings-preview-avatar">${p.photo ? `<img src="${p.photo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : escapeHtml(getInitials(p.name))}</div>
            <div><div id="settings-preview-name" style="font-size:13px;color:var(--text);font-weight:600;">${escapeHtml(p.name || 'District Officer')}</div><div id="settings-preview-role" class="text-faint small">${escapeHtml(p.role || 'Government Validation')}</div></div>
          </div>
        </div>
      </div>
    </div>
  `;
  const nameInput=el('profile-name');
  nameInput.addEventListener('input', ()=>{
    const initials=getInitials(nameInput.value);
    if(!profile.photo){ el('settings-avatar').textContent=initials; el('settings-preview-avatar').textContent=initials; }
    el('settings-preview-name').textContent=nameInput.value.trim() || 'District Officer';
  });
  el('profile-role').addEventListener('input', e=>el('settings-preview-role').textContent=e.target.value.trim() || 'Government Validation');
  el('profile-photo-input').addEventListener('change', handleProfilePhoto);
}
function handleProfilePhoto(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please choose an image file.','warn'); return; }
  if(file.size>2*1024*1024){ toast('Please choose an image smaller than 2 MB.','warn'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const src=reader.result;
    el('settings-avatar').innerHTML=`<img src="${src}" alt="Profile photo">`;
    el('settings-preview-avatar').innerHTML=`<img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    profile.photo=src;
  };
  reader.readAsDataURL(file);
}
function removeProfilePhoto(){
  profile.photo='';
  const initials=getInitials(el('profile-name')?.value || profile.name);
  if(el('settings-avatar')) el('settings-avatar').textContent=initials;
  if(el('settings-preview-avatar')) el('settings-preview-avatar').textContent=initials;
  if(el('profile-photo-input')) el('profile-photo-input').value='';
}
function saveProfileChanges(){
  const name=el('profile-name').value.trim();
  const role=el('profile-role').value.trim();
  const phone=el('profile-phone').value.trim();
  if(!name){ toast('Please enter your full name.','warn'); el('profile-name').focus(); return; }
  if(phone && !/^[0-9+()\\-\\s]{7,18}$/.test(phone)){ toast('Please enter a valid phone number.','warn'); return; }
  profile={...profile,name,role:role||'Government Validation',phone,district:el('profile-district').value,bio:el('profile-bio').value.trim()};
  saveProfile();
  updateProfileUI();
  toast('Profile changes saved successfully.','ok');
}
function resetProfileForm(){
  profile=loadProfile();
  renderSettings();
  toast('Profile form reset to the saved details.','ok');
}

   ============================================================ */
el('global-search').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const q = e.target.value.trim();
    if(!q) return;
    setView('explore');
    setTimeout(()=>{
      const hit = DATA.challenges.find(c=> c.id.toLowerCase()===q.toLowerCase() );
      if(hit){ openProblem(hit.id); return; }
      const dMatch = DISTRICT_NAMES.find(d=>d.toLowerCase().includes(q.toLowerCase()));
      if(dMatch){ el('ex-district').value = dMatch; renderExploreTable(); }
    }, 150);
  }
});

in:'में',on:'पर',by:'द्वारा',at:'पर',is:'है',are:'हैं',has:'है',have:'हैं'},

let currentLanguage = 'en';
const originalTextNodes = new WeakMap();
const originalAttrs = new WeakMap();
const translatedNodes = new WeakMap();
const translatedElements = new WeakMap();
let languageObserver = null;
let translationTimer = null;
let translating = false;

function langString(s, lang){
  if(lang==='en' || !s || !/[A-Za-z]/.test(s)) return s;
  const dict=LANG_TEXT[lang]||{};
  let out=s;
  Object.keys(dict).sort((a,b)=>b.length-a.length).forEach(k=>{
    if(out.includes(k)) out=out.split(k).join(dict[k]);
  });
  const words=LANG_WORDS[lang]||{};
  out=out.replace(/\b[A-Za-z][A-Za-z'’-]*\b/g,w=>words[w]!==undefined?words[w]:w);
  return out;
}

function translateRoot(root, lang){
  if(!root || lang==='en' || translating) return;
  translating=true;
  try{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode()){
      const n=walker.currentNode, p=n.parentElement;
      if(!p || ['SCRIPT','STYLE','NOSCRIPT','TEXTAREA'].includes(p.tagName)) continue;
      if(!/[A-Za-z]/.test(n.nodeValue||'')) continue;
      nodes.push(n);
    }
    for(const n of nodes){
      if(!originalTextNodes.has(n)) originalTextNodes.set(n,n.nodeValue);
      const original=originalTextNodes.get(n);
      const stamp=translatedNodes.get(n);
      if(stamp===lang) continue;
      const translated=langString(original,lang);
      if(n.nodeValue!==translated) n.nodeValue=translated;
      translatedNodes.set(n,lang);
    }

    const els=root.querySelectorAll ? root.querySelectorAll('input,textarea,button,[title],[aria-label],[alt]') : [];
    for(const e of els){
      let rec=originalAttrs.get(e);
      if(!rec){rec={};originalAttrs.set(e,rec);}
      for(const a of ['placeholder','title','aria-label','alt']){
        if(!e.hasAttribute(a)) continue;
        if(rec[a]===undefined) rec[a]=e.getAttribute(a);
        const key=a+':'+lang;
        if(translatedElements.get(e)?.[a]===key) continue;
        e.setAttribute(a,langString(rec[a],lang));
        const state=translatedElements.get(e)||{}; state[a]=key; translatedElements.set(e,state);
      }
    }
  } finally { translating=false; }
}

function setBrandLanguage(lang){
  document.querySelectorAll('.brand-seva').forEach(e=>e.textContent=lang==='en'?'SEVA':'सेवा');
  document.querySelectorAll('.brand-sync').forEach(e=>e.textContent=lang==='en'?'SYNC':'सिंक');
  document.querySelectorAll('.brand-text > span').forEach(e=>e.textContent=lang==='en'?'Social Innovation Platform':'सामाजिक नवाचार मंच');
  document.querySelectorAll('.hero-brand-name span').forEach(e=>e.textContent=lang==='en'?'SEVA':'सेवा');
  document.querySelectorAll('.hero-brand-name em').forEach(e=>e.textContent=lang==='en'?'SYNC':'सिंक');
  document.title=lang==='en'?'SEVA SYNC':'सेवा सिंक';
}

function restoreEnglish(){
  document.querySelectorAll('*').forEach(e=>{
    const state=translatedElements.get(e);
    if(state){
      const rec=originalAttrs.get(e);
      ['placeholder','title','aria-label','alt'].forEach(a=>{
        if(rec && rec[a]!==undefined) e.setAttribute(a,rec[a]);
      });
      translatedElements.delete?.(e);
    }
  });
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){
    const n=walker.currentNode, original=originalTextNodes.get(n);
    if(original!==undefined) n.nodeValue=original;
    translatedNodes.delete?.(n);
  }
  setBrandLanguage('en');
}

function applyLanguage(lang){
  if(!['en','hi'].includes(lang)) lang='en';
  currentLanguage=lang;
  try{localStorage.setItem('seva_sync_language',lang);}catch(e){}
  document.documentElement.lang=lang;
  if(lang==='en') restoreEnglish();
  else {
    setBrandLanguage(lang);
    translateRoot(document.body,lang);
  }
  const sel=document.getElementById('language-select');
  if(sel) sel.value=lang;
}

function setLanguage(lang){
  if(lang===currentLanguage) return;
  if(translationTimer) clearTimeout(translationTimer);
  applyLanguage(lang);
}

function scheduleNewContentTranslation(){
  if(currentLanguage==='en' || translationTimer) return;
  translationTimer=setTimeout(()=>{
    translationTimer=null;
    const content=document.getElementById('content');
    if(content) translateRoot(content,currentLanguage);
    setBrandLanguage(currentLanguage);
  },120);
}

function initLanguageSupport(){
  const sel=document.getElementById('language-select');
  let saved='en';
  try{saved=localStorage.getItem('seva_sync_language')||'en';}catch(e){}
  if(!['en','hi'].includes(saved)) saved='en';
  currentLanguage=['en','hi'].includes(saved)?saved:'en';
  if(sel){
    sel.value=currentLanguage;
    sel.addEventListener('change',e=>setLanguage(e.target.value));
  }

  /* Translate once after the page has finished its initial render. */
  requestAnimationFrame(()=>setTimeout(()=>applyLanguage(currentLanguage),0));

  /* IMPORTANT: observe only new DOM nodes and debounce translation. Do not
     translate the entire document after every mutation. This prevents the
     browser from becoming unresponsive when dashboard views render. */
  languageObserver=new MutationObserver(mutations=>{
    if(currentLanguage==='en') return;
    let hasNewElements=false;
    for(const m of mutations){
      if(m.type!=='childList') continue;
      for(const n of m.addedNodes){
        if(n.nodeType===1){hasNewElements=true;break;}
      }
      if(hasNewElements) break;
    }
    if(hasNewElements) scheduleNewContentTranslation();
  });
  languageObserver.observe(document.getElementById('content')||document.body,{childList:true,subtree:true});
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initLanguageSupport); else initLanguageSupport();
</script>

<script>
/* ===== VISIBLE, SAFE VOICE-TO-TEXT ===== */
(function(){
  function setupVoiceButton(btn){
    const id=btn.getAttribute('data-voice-for');
    const ta=document.getElementById(id);
    if(!ta || btn.dataset.voiceReady==='1') return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ btn.style.display='none'; return; }
    const wrap=btn.closest('.voice-input-wrap');
    const status=wrap ? wrap.querySelector('.voice-status') : null;
    btn.dataset.voiceReady='1';
    btn.addEventListener('click',function(){
      if(window.__sevaVoiceActive){
        if(window.__sevaVoiceActive.ta===ta){window.__sevaVoiceActive.rec.stop();return;}
        try{window.__sevaVoiceActive.rec.stop();}catch(e){}
      }
      const rec=new SR();
      const current=(document.documentElement.lang||'en').toLowerCase();
      rec.lang=current==='hi'?'hi-IN':'en-IN';
      rec.interimResults=true; rec.continuous=false;
      const base=ta.value.replace(/\s*$/,'');
      let finalText='';
      window.__sevaVoiceActive={ta,rec,btn};
      btn.classList.add('listening');
      if(status){status.classList.add('show');status.textContent='Listening… speak now.';}
      rec.onresult=function(e){
        let interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){
          const text=e.results[i][0].transcript;
          if(e.results[i].isFinal) finalText+=(finalText?' ':'')+text.trim();
          else interim+=text;
        }
        ta.value=base+(base&&finalText?' ':'')+finalText+(interim?(finalText||base?' ':'')+interim:'');
        ta.dispatchEvent(new Event('input',{bubbles:true}));
      };
      rec.onerror=function(e){
        if(status) status.textContent=e.error==='not-allowed'?'Microphone permission was blocked.':e.error==='no-speech'?'No speech detected. Try again.':'Voice typing is unavailable right now.';
      };
      rec.onend=function(){
        btn.classList.remove('listening');
        if(status && status.textContent==='Listening… speak now.') status.textContent='Voice typing stopped.';
        if(window.__sevaVoiceActive && window.__sevaVoiceActive.ta===ta) window.__sevaVoiceActive=null;
      };
      try{rec.start();}catch(e){btn.classList.remove('listening');if(status)status.textContent='Voice typing could not start.';window.__sevaVoiceActive=null;}
    });
  }
  function scan(){document.querySelectorAll('[data-voice-for]').forEach(setupVoiceButton);}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',scan); else scan();
  new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
})();
</script>

/* ===== SARA: lightweight local dashboard assistant ===== */
(function(){
  function initSara(){

    const panel=document.createElement('section');
    panel.id='sara-panel'; panel.className='sara-panel'; panel.setAttribute('aria-label','Sara chat assistant');
    panel.innerHTML=`<div class="sara-head"><div class="sara-avatar">S</div><div class="sara-head-info"><strong>Sara AI</strong><small>SEVA SYNC Assistant • Online</small></div><button class="sara-close" type="button" aria-label="Close">×</button></div><div class="sara-messages" id="sara-messages"></div><div class="sara-quick"><button type="button" data-sara-q="How do I report a complaint?">Report issue</button><button type="button" data-sara-q="How can I track my complaint?">Track complaint</button><button type="button" data-sara-q="What can you help me with?">Help</button></div><form class="sara-input" id="sara-form"><input id="sara-input" autocomplete="off" placeholder="Ask Sara something…"><button class="sara-send" type="submit" aria-label="Send">➤</button></form>`;

    const msgs=panel.querySelector('#sara-messages'), input=panel.querySelector('#sara-input');
    function add(text,who){const d=document.createElement('div');d.className='sara-msg '+who;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
    function reply(q){
      const x=q.toLowerCase(); let r='I can help you with reporting civic issues, tracking complaints, understanding your dashboard, and finding the right SEVA SYNC feature.';
      if(/report|complaint|issue|problem/.test(x)) r='To report an issue, open “Report a Challenge” from the dashboard. You can enter the title and description, use voice typing, add the location and evidence, then submit the complaint.';
      else if(/track|status/.test(x)) r='Open “My Complaints” to view your complaint status and follow its progress from submission to resolution.';
      else if(/map|location|gps/.test(x)) r='Use the Civic Map to view reported issues around you and explore their locations and statuses.';
      else if(/feedback|rating|rate/.test(x)) r='After an issue is resolved, use the feedback option to rate the resolution and share your experience.';
      else if(/language|hindi|english/.test(x)) r='SEVA SYNC currently supports English and Hindi. You can switch the language from the language selector.';
      else if(/help|what can|who are you/.test(x)) r='I’m Sara AI, your SEVA SYNC assistant. Try asking me how to report an issue, track a complaint, use the map, or give feedback.';
      setTimeout(()=>add(r,'bot'),220);
    }
    function send(q){q=(q||'').trim();if(!q)return;add(q,'user');input.value='';reply(q);}
